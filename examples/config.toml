#:schema https://github.com/byteowlz/skdlr/schemas/config.schema.json

# Configuration for skdlr.
# Copy this file to $XDG_CONFIG_HOME/skdlr/config.toml and adjust as needed.
# Regenerate with `just generate-config`.

service_prefix = "skdlr"

[logging]
level = "info"

[internal]
check_interval_secs = 60

[executor]
wrapper_args = []

[api]
allowed_origins = ["http://localhost:3000"]
