[workspace]
resolver = "2"
members = [
    "crates/skdlr-core",
    "crates/skdlr-cli",
    "crates/skdlr-tui",
    "crates/skdlr-mcp",
    "crates/skdlr-api",
]

[workspace.package]
version = "0.2.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/byteowlz/skdlr"

[workspace.dependencies]
# Shared across workspace
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = { version = "0.15", features = ["toml"] }
dirs = "5.0"
shellexpand = "3.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

# Cron parsing
cron = "0.15"

# Async
async-trait = "0.1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async runtime
tokio = { version = "1.43", features = ["full"] }

# API/HTTP
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# MCP
rmcp = { version = "0.1", features = ["server", "transport-io"] }

# Internal crates
skdlr-core = { path = "crates/skdlr-core" }

# Platform-specific dependencies are handled in individual crate Cargo.toml files
# using target-specific dependencies with cfg attributes
