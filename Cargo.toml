[workspace]
resolver = "2"
members = [
    "crates/skdlr-core",
    "crates/skdlr-cli",
    "crates/skdlr-tui",
    "crates/skdlr-mcp",
    "crates/skdlr-api",
    "crates/skdlr-service",
]

[workspace.package]
version = "0.2.6"
edition = "2024"
license = "MIT"
repository = "https://github.com/byteowlz/skdlr"

[workspace.dependencies]
# Shared across workspace
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
config = { version = "0.15", features = ["toml"] }
dirs = "5.0"
shellexpand = "3.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.11", features = ["v4", "serde"] }

# Cron parsing
cron = "0.15"

# Async
async-trait = "0.1"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# CLI
clap = { version = "4.5", features = ["derive", "env"] }
clap_complete = "4.5"

# TUI
ratatui = "0.29"
crossterm = "0.28"

# Async runtime
tokio = { version = "1.43", features = ["full"] }

# API/HTTP
axum = "0.8"
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace"] }

# MCP
rmcp = { version = "0.1", features = ["server", "transport-io"] }

# Internal crates
skdlr-core = { path = "crates/skdlr-core" }

# Platform-specific dependencies are handled in individual crate Cargo.toml files
# using target-specific dependencies with cfg attributes

# ── Workspace-wide lint configuration ──────────────────────────────────────────
[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
missing_debug_implementations = "warn"
# Keep these at allow — lib crate exposes pub items consumed by multiple binaries
dead_code = "allow"
unused_imports = "allow"

[workspace.lints.clippy]
# ── Correctness & style ──
collapsible_if = "warn"
collapsible_else_if = "warn"
needless_return = "warn"
needless_borrow = "warn"
clone_on_copy = "warn"
single_char_add_str = "warn"
manual_strip = "warn"
manual_flatten = "warn"
unnecessary_lazy_evaluations = "warn"
unnecessary_map_or = "warn"
io_other_error = "warn"
single_match = "warn"
redundant_closure_for_method_calls = "warn"
match_wildcard_for_single_variants = "warn"
flat_map_option = "warn"
manual_let_else = "warn"
implicit_clone = "warn"
inconsistent_struct_constructor = "warn"
ref_option_ref = "warn"
semicolon_if_nothing_returned = "warn"
unused_self = "warn"
used_underscore_binding = "warn"

# ── Performance ──
cloned_instead_of_copied = "warn"
inefficient_to_string = "warn"
needless_pass_by_value = "warn"

# ── Pedantic (stricter) ──
ptr_arg = "warn"
derivable_impls = "warn"
doc_markdown = "warn"
explicit_into_iter_loop = "warn"
explicit_iter_loop = "warn"
map_unwrap_or = "warn"

# ── Complexity ──
cognitive_complexity = "warn"        # functions with deeply nested/branching logic
too_many_lines = "warn"              # functions > 100 lines
too_many_arguments = "warn"          # functions with > 7 args (override per-site if needed)
large_enum_variant = "warn"          # enum variants with large size disparity
type_complexity = "warn"             # overly nested generic types
option_option = "warn"               # Option<Option<T>> is usually a design smell
struct_excessive_bools = "warn"      # structs with many bool fields
fn_params_excessive_bools = "warn"   # functions with many bool params
needless_collect = "warn"            # .collect() followed by .iter() — just chain
manual_is_variant_and = "warn"       # verbose match when is_some_and/is_ok_and works
wildcard_imports = "warn"            # use foo::* obscures where names come from

# ── Deny (hard errors — use #[cfg_attr(test, allow(...))] in test modules) ──
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"
print_stdout = "deny"
print_stderr = "deny"

# ── Intentionally allowed ──
module_inception = "allow"
module_name_repetitions = "allow"
